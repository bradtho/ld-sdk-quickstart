server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # MIME types (including application/wasm, which Flutter web's CanvasKit
    # needs) are inherited from the base image's http{} block.
    #
    # Deliberately NOT setting Cross-Origin-Embedder-Policy: require-corp.
    # It would block the LaunchDarkly streaming connection, which is
    # cross-origin, and break live flag updates.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
